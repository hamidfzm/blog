# Until both _id fields are filled in, comments simply don't render.
comments:
  giscus:
    repo: hamidfzm/blog
    repo_id: "MDEwOlJlcG9zaXRvcnkxNTE1OTIzMTE="
    category: Comments
    category_id: "DIC_kwDOCQkdd84C9JEw"
