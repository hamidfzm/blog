{%- assign g = site.comments.giscus -%}
{% if g and g.repo_id and g.category_id %}
<section class="comments" aria-label="نظرها">
  <script src="https://giscus.app/client.js"
          data-repo="{{ g.repo }}"
          data-repo-id="{{ g.repo_id }}"
          data-category="{{ g.category | default: 'General' }}"
          data-category-id="{{ g.category_id }}"
          data-mapping="{{ g.mapping | default: 'pathname' }}"
          data-strict="0"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="{{ g.input_position | default: 'top' }}"
          data-theme="{{ g.theme | default: 'preferred_color_scheme' }}"
          data-lang="{{ g.lang | default: site.lang | default: 'en' }}"
          data-loading="lazy"
          crossorigin="anonymous"
          async>
  </script>
</section>
{% endif %}
