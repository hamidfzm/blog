<meta charset="utf-8"/>
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

{%- if page.excerpt -%}
  {%- assign meta_description = page.excerpt | strip_html | normalize_whitespace -%}
{%- else -%}
  {%- assign meta_description = site.description -%}
{%- endif -%}
<meta name="description" content="{{ meta_description }}"/>

<meta name="author" content="{{ site.author }}"/>

{% if site.links.x %}
<meta name="twitter:site" content="@{{ site.links.x }}">
<meta name="twitter:creator" content="@{{ site.links.x }}">
{% endif %}

<link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32x32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16x16.png' | relative_url }}">
<link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
<link rel="mask-icon" href="{{ '/safari-pinned-tab.svg' | relative_url }}" color="#1d6fbf">
<meta name="msapplication-TileColor" content="#1d6fbf">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">

{%- if jekyll.environment == 'production' -%}
  {% seo %}
{%- endif -%}
